schema_version = "1.4"

artifacts = [
    { source = "/workspace", destination = "workspace" },
]

[task]
name = "{task_name}"
version = "1.0.0"

[metadata]
benchmark = "clawgym-bench"
upstream_revision = "c8cbd1d0df033af24fc14064d40d6964ca8f611f"
payload_sha256 = "{content_hash}"
score_mode = "{score_mode}"
score_weight_code = {score_weight_code}
score_weight_rubric = {score_weight_rubric}
missing_component_policy = "use_available_component"

[agent]
timeout_sec = {agent_timeout}

[verifier]
timeout_sec = {verifier_timeout}
environment_mode = "separate"
include_logs = [
    "official_result.json",
    "official_stdout.txt",
    "official_stderr.txt",
    "rubric.json",
    "rubric.txt",
    "judge_request.json",
    "judge_response.json",
    "judge_error.json",
]

[verifier.env]
CLAWGYM_JUDGE_BASE_URL = "${CLAWGYM_JUDGE_BASE_URL:-}"
CLAWGYM_JUDGE_API_KEY = "${CLAWGYM_JUDGE_API_KEY:-}"
CLAWGYM_JUDGE_MODEL = "${CLAWGYM_JUDGE_MODEL:-deepseek-flash}"
CLAWGYM_JUDGE_TIMEOUT_SEC = "${CLAWGYM_JUDGE_TIMEOUT_SEC:-180}"
CLAWGYM_REWARD_TIMEOUT_SEC = "${CLAWGYM_REWARD_TIMEOUT_SEC:-120}"

[verifier.environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
workdir = "/workspace"
