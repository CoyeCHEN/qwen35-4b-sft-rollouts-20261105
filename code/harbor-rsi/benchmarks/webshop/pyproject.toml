[project]
name = "webshop-harbor"
version = "0.1.0"
description = "Official WebShop text environment adapter for Harbor"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
webshop-harbor-adapter = "webshop_harbor.adapter:main"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webshop_harbor"]
