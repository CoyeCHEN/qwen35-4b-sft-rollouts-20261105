schema_version = "1.4"

[task]
name = __TASK_NAME__
authors = [{ name = "Princeton NLP WebShop Team" }]
description = "WebShop text-environment shopping task"
keywords = ["webshop", "shopping", "interactive-agent"]

[metadata]
official_repository = "https://github.com/princeton-nlp/WebShop"
official_commit = "__OFFICIAL_COMMIT__"
product_set = "__PRODUCT_SET__"
goal_index = __GOAL_INDEX__
max_steps = __MAX_STEPS__
formal_official_score = __FORMAL_OFFICIAL_SCORE__

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 120.0
environment_mode = "shared"

[environment]
workdir = "/workspace"
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 12288
