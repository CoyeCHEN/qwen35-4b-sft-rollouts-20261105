[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openharness-sft"
version = "0.2.0"
description = "Standalone adapters and data validation for Open-Harness agent SFT"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
tokenization = ["transformers==5.8.0"]
training = [
  "llamafactory @ git+https://github.com/hiyouga/LLaMA-Factory.git@c683e59edd8f893abc5e1403184a1d0644817d2a",
  "torch==2.8.0", "transformers==5.8.0", "datasets==4.0.0", "accelerate==1.11.0", "deepspeed==0.19.8",
  "flash-attn==2.8.3", "causal-conv1d==1.6.0", "flash-linear-attention==0.5.2", "liger-kernel==0.8.4",
]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["adapters*", "sft*"]

[tool.setuptools.package-data]
sft = ["templates/*", "policies/*.json", "versions.json", "model-sha256.json"]
