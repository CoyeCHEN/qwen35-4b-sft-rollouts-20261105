name: CPU contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Install the wheel outside the source checkout
        run: |
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/sft-wheel"
          "$RUNNER_TEMP/sft-wheel/bin/pip" install "$RUNNER_TEMP/wheels/"*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sft-wheel/bin/python" - <<'PY'
          import tempfile
          from pathlib import Path
          from sft.runtime.config import initialize
          with tempfile.TemporaryDirectory() as path:
              root = Path(path)
              initialize(root, root/'model', root/'hot', root/'archive', ['GPU-'+str(i) for i in range(4)])
              assert (root/'configs/m1-64k.yaml').is_file()
              assert (root/'configs/m2-128k.yaml').is_file()
          PY
  tokenizer:
    runs-on: ubuntu-latest
    env:
      QWEN35_MODEL_PATH: Qwen/Qwen3.5-4B
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[tokenization]'
      - name: Pinned real template and labels; tokenizer files only, no weights
        run: python -m unittest tests.test_qwen35_codec -v
  native:
    # Independent CPU environments; never install both Transformers versions together.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        flavor: [tmax, qwen]
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      DS_BUILD_OPS: '0'
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install the pinned CPU environment
        run: |
          python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          if [ "$FLAVOR" = qwen ]; then
            python -m pip install torchvision==0.23.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
            python -m pip install setuptools==84.2.1 wheel
            python -m pip install --no-build-isolation -r requirements/cpu-qwen.in -c requirements/cpu-qwen.lock
          else
            python -m pip install -r requirements/cpu-tmax.in -c requirements/cpu-tmax.lock
          fi
          python -m pip install --no-deps .
      - name: Native updates, checkpoint, mask and warmup regression; no model weights
        run: |
          if [ "$FLAVOR" = qwen ]; then
            QWEN35_MODEL_PATH=Qwen/Qwen3.5-4B python -m unittest tests.test_native_cpu tests.test_checkpoint_observer tests.test_qwen35_codec -v
          else
            export TMAX_CPU_TESTS=1 TMAX_MODEL_PATH="$RUNNER_TEMP/tmax-tokenizer"
            python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download('allenai/tmax-2b', revision='39227cc1b9d221c53140e56a66094d84d115d579',
              local_dir=os.environ['TMAX_MODEL_PATH'], allow_patterns=['tokenizer.json', 'tokenizer_config.json',
              'config.json', 'generation_config.json', 'chat_template.jinja'])
          PY
            python -m unittest tests.test_tmax_native_cpu tests.test_tmax_delivery tests.test_integration_contracts -v
          fi
